name: Bug report
description: Report a reproducible OpenAthan problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OpenAthan.
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: List the Atom/controller and speaker/base models.
      placeholder: AtomS3R C126 + Voice Pyramid A167
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenAthan version
      placeholder: v0.x.x or development commit
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
