name: Firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev
          python -m pip install -r firmware/esphome/requirements.txt
      - name: Build and test core with UBSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_FLAGS='-fsanitize=undefined -fno-sanitize-recover=all'
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python tools/run_tests.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Check out the pinned installer contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenAthan-Project/website
          ref: ba356c80f00ff07046b7433c03e0fdc9802f64b0
          path: .installer-contract
          persist-credentials: false
      - name: Verify producer output with the real installer validator
        run: python tests/check_installer_contract.py --website .installer-contract
      - name: Validate developer configurations
        run: |
          python tools/prepare_ci.py --output-dir "$RUNNER_TEMP/audio-fixture"
          for config in feasibility/baseline feasibility/calculations feasibility/shared-audio scheduler/development scheduler/device scheduler/validation openathan provisioning/validation upgrades/qualification waveshare/audio waveshare/development waveshare/diagnostics; do
            python -m esphome config "firmware/esphome/$config.yaml" > "$RUNNER_TEMP/config.log" 2>&1 || { cat "$RUNNER_TEMP/config.log"; exit 1; }
          done

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [device, validation, reference, provisioning-validation, upgrade-qualification, upgrade-startup-failure, waveshare-audio, waveshare-display, waveshare-diagnostics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Determine whether firmware compilation is required
        id: build_policy
        continue-on-error: true
        run: python tools/ci_build_policy.py
      - name: Install build dependencies
        if: steps.build_policy.outcome != 'success' || steps.build_policy.outputs.build_required != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libffi-dev libssl-dev
          python -m pip install -r firmware/esphome/requirements.txt
      - name: Compile and inspect firmware
        if: steps.build_policy.outcome != 'success' || steps.build_policy.outputs.build_required != 'false'
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ESPHOME_BUILD_PATH: ${{ runner.temp }}/firmware
        run: |
          python tools/prepare_ci.py --output-dir "$RUNNER_TEMP/audio-fixture"
          options=()
          if [ "$CONFIGURATION" = reference ]; then
            config=firmware/esphome/openathan.yaml
            image=openathan
          elif [ "$CONFIGURATION" = provisioning-validation ]; then
            config=firmware/esphome/provisioning/validation.yaml
            image=openathan-test
          elif [ "$CONFIGURATION" = upgrade-qualification ] || [ "$CONFIGURATION" = upgrade-startup-failure ]; then
            config=firmware/esphome/upgrades/qualification.yaml
            image=openathan-test
            if [ "$CONFIGURATION" = upgrade-startup-failure ]; then
              options=(-s qualification_version v0.0.3 -s qualification_startup_failure true)
            fi
          elif [ "$CONFIGURATION" = waveshare-audio ] || [ "$CONFIGURATION" = waveshare-display ] || [ "$CONFIGURATION" = waveshare-diagnostics ]; then
            config=firmware/esphome/waveshare/audio.yaml
            if [ "$CONFIGURATION" = waveshare-display ]; then
              config=firmware/esphome/waveshare/development.yaml
            fi
            if [ "$CONFIGURATION" = waveshare-diagnostics ]; then
              config=firmware/esphome/waveshare/diagnostics.yaml
            fi
            image=openathan-test
          else
            config="firmware/esphome/scheduler/$CONFIGURATION.yaml"
            image=openathan-feasibility
          fi
          python -m esphome "${options[@]}" compile "$config" > "$RUNNER_TEMP/compile.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/compile.log"; exit 1; }
          python tools/check_feasibility.py \
            --build-dir "$ESPHOME_BUILD_PATH/$image" \
            --log "$RUNNER_TEMP/compile.log" \
            --audio-image "$RUNNER_TEMP/audio-fixture/athan-audio.bin"
      - name: Test settings JSON with the resolved firmware library
        if: matrix.configuration == 'device' && (steps.build_policy.outcome != 'success' || steps.build_policy.outputs.build_required != 'false')
        env:
          OPENATHAN_ARDUINOJSON_INCLUDE: ${{ runner.temp }}/firmware/openathan-feasibility/managed_components/bblanchon__arduinojson/src
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_FLAGS='-fsanitize=undefined -fno-sanitize-recover=all'
          cmake --build build --target openathan_core --parallel 2
          python -m unittest discover -s tests -p test_settings_adapter.py -v
          python tools/check_upgrade_runtime.py --arduinojson "$OPENATHAN_ARDUINOJSON_INCLUDE"
      - name: Test update request formatting with the resolved SDK
        if: matrix.configuration == 'reference' && (steps.build_policy.outcome != 'success' || steps.build_policy.outputs.build_required != 'false')
        env:
          ESPHOME_BUILD_PATH: ${{ runner.temp }}/firmware
        run: python tools/check_upgrade_http.py --build-dir "$ESPHOME_BUILD_PATH/openathan"

  device-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production authentication test adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev
          cmake -S . -B build -G Ninja -DCMAKE_CXX_FLAGS='-fsanitize=undefined -fno-sanitize-recover=all'
          cmake --build build --target digest_test_bridge --parallel 2
      - name: Install browser test dependencies
        working-directory: web/device-ui
        run: |
          node --version
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Test device UI and browser Digest login
        working-directory: web/device-ui
        env:
          OPENATHAN_TEST_BROWSERS: chromium,webkit
        run: npm test
