# OpenAthan official reference-firmware entry point.
#
# This file composes the hardware-independent OpenAthan package with the
# C126 + A167 reference-hardware package. It remains a non-buildable scaffold
# until those packages and the reference hardware have been implemented and
# validated. Do not publish it as an end-user firmware release yet.
#
# Official-only provisioning, networking, OTA, time synchronization, local UI,
# and release settings will also be configured at this layer. They do not
# belong in the reusable packages/openathan.yaml package.

packages:
  openathan: !include packages/openathan.yaml
  reference_hardware: !include packages/hardware/voice-pyramid.yaml
