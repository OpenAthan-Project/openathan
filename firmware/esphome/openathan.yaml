# Reference firmware with USB provisioning and a device-hosted settings UI.
# Development candidate: public installer, approved audio, and hardware acceptance
# are separate release gates. No private credentials are compiled into this image.
esphome:
  name: openathan
  name_add_mac_suffix: true
  min_version: 2026.9.0
  project:
    name: OpenAthan.reference
    version: v0.4.0

packages:
  openathan: !include packages/openathan.yaml
  product: !include packages/product.yaml
  reference_hardware: !include packages/hardware/voice-pyramid.yaml
  reference_display: !include boards/atom-s3r-gc9107-display.yaml

voice_pyramid:
  lights:
    id: pyramid_lights
    i2c_id: pyramid_bus
    address: 0x1A

openathan:
  light_output_id: pyramid_lights

binary_sensor:
  - platform: gpio
    id: front_button
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - openathan.stop:
              id: athan_scheduler
      - min_length: 2s
        max_length: 5s
        then:
          - openathan.skip_next:
              id: athan_scheduler
      - min_length: 6s
        max_length: 10s
        then:
          - openathan.cancel_skip:
              id: athan_scheduler
