# Compile-only baseline; never a release entry point.
esphome:
  name: openathan-feasibility
  min_version: 2026.9.0

packages:
  hardware: !include ../packages/hardware/voice-pyramid.yaml

esp32:
  partitions: partitions.csv

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

media_player:
  - platform: speaker
    id: athan_player
    name: Athan player
    # User-selected control level; ESPHome maps it within the 60% output ceiling.
    volume_initial: 70%
    volume_max: 60%
    announcement_pipeline:
      speaker: pyramid_speaker
      format: MP3
      sample_rate: 44100
      num_channels: 1
