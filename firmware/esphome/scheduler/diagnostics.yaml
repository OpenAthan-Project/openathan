# Optional encrypted local diagnostics for developer device validation.
esphome:
  includes:
    - diagnostics.h
  on_boot:
    priority: -110
    then:
      - lambda: openathan_diagnostics();

api:
  reboot_timeout: 0s
  encryption:
    key: !secret diagnostic_api_key
  actions:
    - action: get_settings
      supports_response: only
      then:
        - api.respond:
            data: !lambda id(athan_scheduler).write_settings_json(root);
    - action: set_settings
      supports_response: only
      variables:
        payload: string
      then:
        - lambda: id(athan_scheduler).read_settings_json(payload);
        - api.respond:
            success: !lambda return id(athan_scheduler).settings_request_ok();
            error_message: !lambda return id(athan_scheduler).settings_request_error();
            data: !lambda id(athan_scheduler).write_settings_json(root);

text_sensor:
  - platform: template
    name: Settings application
    update_interval: 1s
    lambda: return std::string(id(athan_scheduler).settings_application_status());
  - platform: template
    name: Scheduler status
    update_interval: 1s
    lambda: |-
      const auto s = id(athan_scheduler).status();
      char text[256];
      snprintf(text, sizeof(text), "clock=%d ready=%d playing=%d fault=%s next=%s utc=%lld skip=%s day=%ld",
               s.clock_ready, s.automatic_ready, s.playing, openathan::fault_name(s.fault),
               s.next ? openathan::prayer_name(s.next->key.prayer) : "none",
               s.next ? static_cast<long long>(s.next->utc) : 0LL,
               s.skip ? openathan::prayer_name(s.skip->prayer) : "none",
               s.skip ? static_cast<long>(s.skip->day) : 0L);
      return std::string(text);
  - platform: template
    name: Scheduler conflicts
    update_interval: 1s
    lambda: |-
      std::string text;
      for (const auto &conflict : id(athan_scheduler).status().conflicts) {
        if (!text.empty()) text += " | ";
        text += openathan::describe_conflict(conflict);
      }
      return text.empty() ? std::string("none") : text;

interval:
  - interval: 15s
    then:
      - lambda: openathan_diagnostics();

button:
  - platform: template
    name: Verify audio image
    on_press:
      - lambda: |-
          if (!id(athan_audio).playing()) openathan_audio_digest();
          else ESP_LOGW("oa_diagnostics", "Stop audio before hashing the partition");
  - platform: restart
    name: Diagnostic restart
  - platform: template
    name: Diagnostic status
    on_press:
      - lambda: openathan_diagnostics();
