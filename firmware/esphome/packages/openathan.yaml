# Reusable, hardware-independent OpenAthan ESPHome package.
#
# Loads components/openathan. The consuming configuration supplies the time
# source, explicit settings and a Playback capability.
#
# Required capability:
# - audio playback, provided by a media player or speaker-backed adapter
#
# Optional capabilities:
# - status light(s)
# - display
# - physical, touch, or other controls
# - microphone
# - RTC
# - removable storage
# - Home Assistant or another external integration
#
# Do not add a board, GPIO mapping, Wi-Fi credentials/configuration, native API
# requirement, or Voice Pyramid dependency here.

external_components:
  - source:
      type: local
      path: ../components
    components: [openathan]
