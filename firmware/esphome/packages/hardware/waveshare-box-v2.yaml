packages:
  board: !include ../../boards/waveshare-box-v2.yaml

substitutions:
  athan_speaker_id: waveshare_speaker
  athan_playback_id: waveshare_audio

external_components:
  - source:
      type: local
      path: ../../components
    components: [waveshare_box_audio]
  - source:
      type: local
      path: ../../components
    components: [waveshare_box_rtc]

# PCF85063A on the vendor/physically confirmed GPIO10/11 shared bus.
# First use waits for SNTP; subsequent powered resets can restore verified UTC.
time:
  - platform: waveshare_box_rtc
    id: waveshare_rtc
    network_time_id: athan_clock
    i2c_id: waveshare_bus
    address: 0x51
    timezone: UTC
    update_interval: never

audio_dac:
  - platform: es8311
    id: waveshare_dac
    i2c_id: waveshare_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: waveshare_speaker
    i2s_audio_id: waveshare_audio_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 44100
    channel: mono
    audio_dac: waveshare_dac

waveshare_box_audio:
  id: waveshare_audio
  playback_id: athan_audio
  dac_id: waveshare_dac
  amplifier_pin: GPIO15

# BOOT is GPIO0 on the V2 schematic. Match the reference front-button controls.
# Holding BOOT during reset/power-on still selects ROM download mode.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - openathan.stop:
              id: athan_scheduler
      - min_length: 2s
        max_length: 5s
        then:
          - openathan.skip_next:
              id: athan_scheduler
      - min_length: 6s
        max_length: 10s
        then:
          - openathan.cancel_skip:
              id: athan_scheduler
