packages:
  board: !include ../../boards/waveshare-box-v2.yaml

substitutions:
  athan_speaker_id: waveshare_speaker
  athan_playback_id: waveshare_audio

external_components:
  - source:
      type: local
      path: ../../components
    components: [waveshare_box_audio]

audio_dac:
  - platform: es8311
    id: waveshare_dac
    i2c_id: waveshare_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: waveshare_speaker
    i2s_audio_id: waveshare_audio_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 44100
    channel: mono
    audio_dac: waveshare_dac

waveshare_box_audio:
  id: waveshare_audio
  playback_id: athan_audio
  dac_id: waveshare_dac
  amplifier_pin: GPIO15
