packages:
  reference_board: !include ../../boards/m5stack-atom-s3r-voice-pyramid.yaml

external_components:
  - source:
      type: local
      path: ../../components
    components: [voice_pyramid]

voice_pyramid:
  clock:
    id: pyramid_clock
    i2c_id: pyramid_bus
    address: 0x60
  amplifier:
    id: pyramid_amplifier
    i2c_id: pyramid_bus
    address: 0x5B

audio_dac:
  - platform: es8311
    id: pyramid_dac
    i2c_id: pyramid_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100

speaker:
  - platform: i2s_audio
    id: pyramid_speaker
    i2s_audio_id: pyramid_audio_bus
    i2s_dout_pin: GPIO7
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 44100
    channel: mono
    audio_dac: pyramid_dac
