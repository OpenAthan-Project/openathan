# C126 + A167 audio wiring verified in private diagnostics on 2026-09-24.
# This configuration does not claim touch/display/microphone acceptance.
esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: 5.5.5

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: pyramid_bus
    sda: GPIO38
    scl: GPIO39
    scan: false

i2s_audio:
  - id: pyramid_audio_bus
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO6
