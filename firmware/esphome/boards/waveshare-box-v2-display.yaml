# ST77916 360x360 QSPI panel; TCA9554 register/pin protocol is PCA9554-compatible.
# Init register values: Waveshare ESP-IDF example LCD_Driver/ST77916.c,
# vendor_specific_init_new. See docs/development/waveshare-box-v2.md for sources.
substitutions:
  display_brightness_percent: "50"

external_components:
  - source:
      type: local
      path: ../components
    components: [openathan_display, waveshare_box_display]

pca9554:
  - id: waveshare_io
    i2c_id: waveshare_bus
    address: 0x20

spi:
  - id: waveshare_display_spi
    type: quad
    clk_pin: GPIO40
    data_pins: [GPIO46, GPIO45, GPIO42, GPIO41]

output:
  - platform: ledc
    id: waveshare_backlight_pwm
    pin: GPIO5
    frequency: 5000Hz

waveshare_box_display:
  id: waveshare_backlight
  output_id: waveshare_backlight_pwm
  display_id: waveshare_status_lcd
  brightness_percent: ${display_brightness_percent}

openathan:
  display_output_id: waveshare_backlight

display:
  - platform: mipi_spi
    id: waveshare_status_lcd
    model: CUSTOM
    spi_id: waveshare_display_spi
    bus_mode: quad
    dimensions: [360, 360]
    cs_pin: GPIO21
    reset_pin:
      pca9554: waveshare_io
      number: 1  # Zero-based P1 = vendor's one-based EXIO2; active-low reset.
      mode: OUTPUT
    data_rate: 40MHz
    color_depth: 16
    color_order: RGB
    invert_colors: true
    rotation: 180  # Read from the side opposite the rear USB cable.
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false
    init_sequence:
      - [0xF0, 0x28]
      - [0xF2, 0x28]
      - [0x73, 0xF0]
      - [0x7C, 0xD1]
      - [0x83, 0xE0]
